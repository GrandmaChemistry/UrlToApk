plugins {
    id 'com.android.application'
}

def appUrl = project.hasProperty('APP_URL') ? project.property('APP_URL') : 'https://www.example.com'
def appName = project.hasProperty('APP_NAME') ? project.property('APP_NAME') : 'WebView App'
def themeColor = project.hasProperty('THEME_COLOR') ? project.property('THEME_COLOR') : '#2196F3'

android {
    namespace 'com.webview.app'
    compileSdk 34

    defaultConfig {
        applicationId project.hasProperty('PACKAGE_NAME') ? project.property('PACKAGE_NAME') : 'com.webview.app'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "APP_URL", "\"${appUrl}\""
        buildConfigField "String", "APP_NAME", "\"${appName}\""
        buildConfigField "String", "THEME_COLOR", "\"${themeColor}\""

        resValue "string", "app_name", appName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.9.0'
}
