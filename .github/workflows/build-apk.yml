name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: '网站URL (例如: https://www.example.com)'
        required: true
        type: string
      app_name:
        description: '应用名称'
        required: true
        type: string
        default: 'My App'
      package_name:
        description: '应用包名 (例如: com.example.app)'
        required: true
        type: string
        default: 'com.webview.app'
      theme_color:
        description: '主题色 (例如: #2196F3)'
        required: false
        type: string
        default: '#2196F3'
      app_icon_url:
        description: '应用图标URL (公开可访问的PNG图片地址，可选)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Process custom icon
        if: ${{ github.event.inputs.app_icon_url != '' }}
        run: |
          # Download icon from URL with security options
          curl -L --fail --max-time 30 --max-filesize 10485760 -o /tmp/app_icon.png "${{ github.event.inputs.app_icon_url }}"
          
          # Validate PNG file format
          if ! file /tmp/app_icon.png | grep -q "PNG image"; then
            echo "Error: Invalid PNG image format"
            exit 1
          fi
          
          # Install ImageMagick for image resizing
          sudo apt-get update && sudo apt-get install -y imagemagick
          
          # Resize icons for different densities
          convert /tmp/app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/app_icon.png -resize 48x48 app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          convert /tmp/app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/app_icon.png -resize 72x72 app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          convert /tmp/app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/app_icon.png -resize 96x96 app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          convert /tmp/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/app_icon.png -resize 144x144 app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          convert /tmp/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert /tmp/app_icon.png -resize 192x192 app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PAPP_URL="${{ github.event.inputs.app_url }}" \
            -PAPP_NAME="${{ github.event.inputs.app_name }}" \
            -PPACKAGE_NAME="${{ github.event.inputs.package_name }}" \
            -PTHEME_COLOR="${{ github.event.inputs.theme_color }}"

      - name: Sign APK with release key
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        continue-on-error: true

      - name: Sign APK with debug key (fallback)
        id: sign_debug
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
        run: |
          # Sanitize app name for filename
          SAFE_NAME=$(echo "${{ github.event.inputs.app_name }}" | tr ' ' '_' | tr -cd '[:alnum:]_-')
          
          # Check if release signing was successful
          if [ -f "app/build/outputs/apk/release/app-release-signed.apk" ]; then
            mv app/build/outputs/apk/release/app-release-signed.apk "app/build/outputs/apk/release/${SAFE_NAME}.apk"
            echo "signed=release" >> $GITHUB_OUTPUT
            echo "APK is signed with release key"
          else
            echo "Release signing not available, using debug key..."
            
            # Generate a debug keystore
            # Note: Using standard Android debug keystore credentials ('android') is intentional
            # for debug signing compatibility. This should never be used for production releases.
            keytool -genkeypair -v \
              -keystore /tmp/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            
            # Find the unsigned APK
            UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
            
            # Align the APK
            ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/zipalign -v -p 4 \
              "$UNSIGNED_APK" \
              "app/build/outputs/apk/release/app-release-aligned.apk"
            
            # Sign the APK with debug key
            ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner sign \
              --ks /tmp/debug.keystore \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "app/build/outputs/apk/release/${SAFE_NAME}.apk" \
              "app/build/outputs/apk/release/app-release-aligned.apk"
            
            # Verify the signature
            ${ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}/apksigner verify "app/build/outputs/apk/release/${SAFE_NAME}.apk" \
              || { echo "APK signature verification failed"; exit 1; }
            
            echo "signed=debug" >> $GITHUB_OUTPUT
            echo "::notice::APK is signed with debug key. For production, configure SIGNING_KEY, KEY_ALIAS, KEY_STORE_PASSWORD and KEY_PASSWORD secrets."
            
            # Clean up intermediate and temporary files
            rm -f "app/build/outputs/apk/release/app-release-unsigned.apk"
            rm -f "app/build/outputs/apk/release/app-release-aligned.apk"
            rm -f "/tmp/debug.keystore"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "${{ github.event.inputs.app_name }} - Build ${{ github.run_number }}"
          body: |
            ## 应用信息
            - **应用名称**: ${{ github.event.inputs.app_name }}
            - **包名**: ${{ github.event.inputs.package_name }}
            - **URL**: ${{ github.event.inputs.app_url }}
            - **主题色**: ${{ github.event.inputs.theme_color }}
            - **签名状态**: ${{ steps.sign_debug.outputs.signed == 'release' && '正式签名' || '调试签名' }}
            
            ## 功能特性
            - WebView 加载指定URL
            - 返回键二次确认退出
            - JavaScript Bridge 原生功能调用
            
            ## 安装说明
            ${{ steps.sign_debug.outputs.signed == 'debug' && '> ⚠️ 此APK使用调试签名，可以正常安装使用。如需正式签名，请配置仓库的签名密钥。' || '✅ 此APK已使用正式签名。' }}
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
